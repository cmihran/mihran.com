<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Charlie Mihran</title>
  <meta name="description" content="Charlie Mihran's personal site and side projects.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap">
  <style>
    /* One-page site: black background, a drifting white starfield, and three "pages"
       (Home, Projects, Links) that you move between with the nav, wheel, swipe or arrow keys.
       No libraries and no build step. */
    :root {
      --bg: #000;
      --fg: #fff;
      --muted: rgba(255, 255, 255, .62);
      --faint: rgba(255, 255, 255, .38);
      --line: rgba(255, 255, 255, .16);
      --panel: rgba(255, 255, 255, .07);
      --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
      --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
      --ease: cubic-bezier(.2, .7, .2, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; overscroll-behavior: none; }
    body { font: 400 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    :focus-visible { outline: 2px solid #fff; outline-offset: 3px; border-radius: 6px; }
    ::selection { background: rgba(255, 255, 255, .28); }

    #sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }

    /* ---------- Header ---------- */
    header {
      position: fixed; z-index: 10; top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: calc(20px + env(safe-area-inset-top)) clamp(20px, 4vw, 52px) 0;
    }
    .brand { display: flex; align-items: center; gap: 10px; font: 600 20px/1 var(--sans); letter-spacing: -.02em; flex: 1; }
    .brand svg { width: 38px; height: 38px; flex: none; fill: none; stroke: currentColor; stroke-width: 5.5; stroke-linecap: round; stroke-linejoin: round; }
    .menu {
      position: relative; display: flex; padding: 4px; border-radius: 999px;
      background: rgba(255, 255, 255, .08); border: 1px solid var(--line);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    }
    .menu a { position: relative; z-index: 1; padding: 7px 16px; border-radius: 999px; font: 500 14px/1.2 var(--sans); color: var(--muted); transition: color .3s; }
    .menu a[aria-current="page"] { color: #000; }
    .menu a:not([aria-current="page"]):hover { color: #fff; }
    .pill-bg { position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 0; width: 0; border-radius: 999px; background: #fff; transition: transform .5s var(--ease), width .5s var(--ease); }
    .head-end { flex: 1; display: flex; justify-content: flex-end; }

    .btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px;
      font: 600 13px/1 var(--sans); letter-spacing: .04em; text-transform: uppercase;
      transition: transform .2s var(--ease), background-color .2s, color .2s, border-color .2s;
    }
    .btn-solid { background: #fff; color: #000; }
    .btn-solid:hover { transform: translateY(-1px) scale(1.03); }
    .btn-ghost { color: #fff; border: 1px solid var(--line); }
    .btn-ghost:hover { border-color: rgba(255, 255, 255, .5); background: var(--panel); }

    /* ---------- Pages ---------- */
    #pages { position: fixed; inset: 0; z-index: 1; }
    .page {
      position: absolute; inset: 0;
      padding: calc(92px + env(safe-area-inset-top)) clamp(20px, 5vw, 72px) calc(48px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; justify-content: center;
      opacity: 0; visibility: hidden; transform: translateY(28px);
      transition: opacity .5s ease, transform .6s var(--ease), visibility 0s linear .6s;
    }
    .page.is-before { transform: translateY(-28px); }
    .page.is-active { opacity: 1; visibility: visible; transform: none; transition: opacity .6s ease .12s, transform .7s var(--ease) .12s, visibility 0s; }
    .inner { width: 100%; max-width: 1200px; margin: 0 auto; }

    .eyebrow { font: 500 12px/1.4 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    h1 { font: 300 clamp(48px, 9vw, 112px)/1 var(--sans); letter-spacing: -.04em; margin: 18px 0 20px; }
    .serif { font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: -.01em; }
    .blurb { margin-top: 20px; max-width: 34em; color: var(--muted); font-size: 18px; }
    .actions { margin-top: 36px; display: flex; flex-wrap: wrap; gap: 12px; }
    .hint { position: absolute; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom)); transform: translateX(-50%); font: 400 11px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--faint); }

    /* Page 2: stacked project cards that tilt toward the cursor, with a numbered list */
    .head-c { text-align: center; }
    .head-c .serif { font-size: clamp(34px, 4.5vw, 52px); line-height: 1.1; margin-top: 6px; }
    .stage { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(220px, .7fr); align-items: center; gap: clamp(24px, 5vw, 72px); margin-top: clamp(20px, 4vh, 44px); }
    .stack-wrap { perspective: 1500px; display: grid; place-items: center; padding: 10px 0 10px 40px; }
    .stack {
      position: relative; width: min(640px, 100%); aspect-ratio: 16 / 10;
      transform-style: preserve-3d; will-change: transform;
      transform: rotateX(calc(5deg + var(--rx, 0deg))) rotateY(calc(-13deg + var(--ry, 0deg))) rotateZ(-2deg);
    }
    .card {
      position: absolute; inset: 0; display: flex; flex-direction: column; padding: clamp(18px, 3vw, 32px);
      border-radius: 22px; background: #f4f4f2; color: #0a0a0a;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .5), 0 40px 90px -30px rgba(255, 255, 255, .14);
      --d: 0;
      transform: translate3d(calc(var(--d) * -26px), 0, calc(var(--d) * -30px));
      opacity: max(0, calc(1 - var(--d) * .17));
      filter: brightness(calc(1 - var(--d) * .1));
      transition: transform .6s var(--ease), opacity .5s ease, filter .5s ease;
    }
    .card.gone { transform: translate3d(70px, 0, 60px) rotateZ(4deg); opacity: 0; pointer-events: none; }
    .card .no { font: 500 11px/1 var(--mono); letter-spacing: .14em; color: #777; }
    .card h2 { font: 800 clamp(34px, 5vw, 60px)/1 var(--sans); letter-spacing: -.045em; margin-top: 14px; }
    .card .repo { font: 400 12px/1.4 var(--mono); letter-spacing: .06em; color: #888; margin-top: 8px; }
    .card p { font-size: clamp(14px, 1.5vw, 17px); line-height: 1.5; color: #4d4d52; margin-top: 12px; max-width: 28em; }
    .card .foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .tags span { background: #0a0a0a; color: #fff; font: 600 11px/1 var(--sans); letter-spacing: .05em; text-transform: uppercase; padding: 7px 11px; border-radius: 999px; }
    .card .go { display: flex; gap: 8px; }
    .card .go a { font: 600 12px/1 var(--sans); letter-spacing: .05em; text-transform: uppercase; padding: 9px 14px; border-radius: 999px; border: 1px solid #c9c9cc; transition: background-color .2s, color .2s, border-color .2s; }
    .card .go a:first-child { background: #0a0a0a; color: #fff; border-color: #0a0a0a; }
    .card .go a:hover { background: #fff; color: #0a0a0a; border-color: #0a0a0a; }
    .list { list-style: none; }
    .list button { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; padding: 11px 16px; border-radius: 12px; color: var(--faint); font: 500 18px/1.3 var(--sans); transition: color .25s, background-color .25s; }
    .list .n { font: 400 11px/1 var(--mono); letter-spacing: .08em; width: 20px; }
    .list .spark { margin-left: auto; opacity: 0; transform: scale(.4) rotate(-40deg); transition: opacity .25s, transform .4s var(--ease); font-size: 14px; }
    .list button:hover { color: var(--muted); }
    .list button[aria-selected="true"] { color: #fff; background: var(--panel); }
    .list button[aria-selected="true"] .spark { opacity: .8; transform: none; }

    /* Page 3: links */
    .rows { margin-top: 36px; border-top: 1px solid var(--line); max-width: 640px; }
    .rows a { display: flex; align-items: center; justify-content: space-between; padding: 22px 4px; border-bottom: 1px solid var(--line); font: 300 clamp(28px, 4vw, 44px)/1.1 var(--sans); letter-spacing: -.03em; transition: padding .35s var(--ease), color .2s; }
    .rows a small { font: 400 12px/1 var(--mono); letter-spacing: .1em; color: var(--faint); text-transform: uppercase; transition: color .2s; }
    .rows a:hover { padding-left: 16px; }
    .rows a:hover small { color: #fff; }

    /* ---------- Progress line ---------- */
    .progress { position: fixed; z-index: 10; left: 0; bottom: 0; height: 2px; width: 100%; background: rgba(255, 255, 255, .08); }
    .progress i { display: block; height: 100%; width: 0; background: #fff; transition: width .6s var(--ease); }

    /* ---------- Phones ---------- */
    @media (max-width: 820px) {
      .head-end { display: none; }
      .brand { flex: none; font-size: 17px; }
      header { gap: 12px; }
      .menu a { padding: 7px 11px; font-size: 13px; }
      .stage { grid-template-columns: 1fr; gap: 20px; margin-top: 16px; }
      .stack-wrap { padding: 6px 10px 6px 30px; }
      .stack { width: min(100%, 520px); aspect-ratio: 5 / 4; transform: rotateX(calc(3deg + var(--rx, 0deg))) rotateY(calc(-6deg + var(--ry, 0deg))) rotateZ(-1.5deg); }
      .card { border-radius: 18px; transform: translate3d(calc(var(--d) * -16px), 0, calc(var(--d) * -30px)); }
      .list button { padding: 8px 12px; font-size: 16px; }
      .hint { display: none; }
    }
    @media (max-width: 480px) { .brand span { display: none; } }
    @media (max-height: 640px) and (max-width: 820px) { .head-c .serif { font-size: 28px; } .list button { padding: 5px 12px; } }

    @media (prefers-reduced-motion: reduce) {
      .page, .page.is-active, .card, .pill-bg, .progress i, .list .spark { transition: none !important; }
    }
  </style>
  <noscript><style>
    html, body { overflow: auto; height: auto; }
    #pages { position: static; } .page { position: static; opacity: 1; visibility: visible; transform: none; min-height: 100vh; }
    header { position: static; } .stack { aspect-ratio: auto; } .card { position: static; margin-bottom: 12px; --d: 0; }
  </style></noscript>
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>

  <header>
    <a class="brand" href="#home" aria-label="charlie.mihran.com, home"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M39.6 15 A20 20 0 1 0 29 52 L29 24 L40 40 L51 24 L51 52"/></svg><span>charlie.mihran.com</span></a>
    <nav class="menu" id="menu" aria-label="Sections">
      <span class="pill-bg" aria-hidden="true"></span>
      <a href="#home">Home</a>
      <a href="#projects">Projects</a>
      <a href="#links">Links</a>
    </nav>
    <div class="head-end"></div>
  </header>

  <main id="pages">
    <section class="page" id="home" aria-label="Home">
      <div class="inner">
        <h1>Charlie Mihran</h1>
        <p class="blurb">Side projects and web experiments.</p>
      </div>
      <p class="hint">Scroll or swipe</p>
    </section>

    <section class="page" id="projects" aria-label="Projects">
      <div class="inner">
        <div class="head-c">
          <p class="eyebrow">Selected projects</p>
          <p class="serif">Things I've built</p>
        </div>
        <div class="stage">
          <div class="stack-wrap"><div class="stack" id="stack"></div></div>
          <ul class="list" id="list" role="listbox" aria-label="Projects"></ul>
        </div>
      </div>
    </section>

    <section class="page" id="links" aria-label="Links">
      <div class="inner">
        <p class="eyebrow">Elsewhere</p>
        <h1 class="serif" style="font-weight:400">Find me</h1>
        <div class="rows">
          <a href="https://github.com/cmihran" rel="noopener">GitHub <small>github.com/cmihran ↗</small></a>
          <a href="https://www.linkedin.com/in/cmihran/" rel="noopener">LinkedIn <small>in/cmihran ↗</small></a>
        </div>
      </div>
    </section>
  </main>

  <div class="progress" aria-hidden="true"><i id="bar"></i></div>

  <script>
  (() => {
    "use strict";

    // ---------- Projects (edit this list) ----------
    // url: where the project lives (omit if it has none). repo: the GitHub repo name.
    const PROJECTS = [
      { name: "mihran.com", repo: "cmihran/mihran.com", desc: "This site: plain static HTML on Cloudflare Workers.", tags: ["HTML", "Cloudflare"], url: "https://mihran.com/" },
    ];

    const $ = (s, r = document) => r.querySelector(s);
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const coarse = matchMedia("(pointer: coarse)").matches;

    // ---------- Build the project cards + list ----------
    const stack = $("#stack"), list = $("#list");
    const pad = (n) => String(n).padStart(2, "0");
    PROJECTS.forEach((p, i) => {
      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML =
        `<span class="no">${pad(i + 1)} / ${pad(PROJECTS.length)}</span>` +
        `<h2></h2><span class="repo"></span><p></p>` +
        `<div class="foot"><div class="tags"></div><div class="go"></div></div>`;
      $("h2", card).textContent = p.name;
      $(".repo", card).textContent = "github.com/" + p.repo;
      $("p", card).textContent = p.desc;
      p.tags.forEach((t) => { const s = document.createElement("span"); s.textContent = t; $(".tags", card).append(s); });
      const go = $(".go", card);
      if (p.url) go.append(Object.assign(document.createElement("a"), { href: p.url, textContent: "Open ↗" }));
      go.append(Object.assign(document.createElement("a"), { href: "https://github.com/" + p.repo, textContent: "Repo ↗", rel: "noopener" }));
      stack.append(card);

      const li = document.createElement("li");
      const b = document.createElement("button");
      b.type = "button"; b.setAttribute("role", "option");
      b.innerHTML = `<span class="n">${pad(i + 1)}</span><span class="t"></span><span class="spark" aria-hidden="true">✦</span>`;
      $(".t", b).textContent = p.name;
      b.addEventListener("click", () => select(i));
      b.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse") select(i); });
      b.addEventListener("focus", () => select(i));
      li.append(b); list.append(li);
    });
    const cards = [...stack.children], buttons = [...list.querySelectorAll("button")];
    let sel = -1;
    function select(i) {
      if (i === sel) return;
      sel = i;
      cards.forEach((c, k) => {
        const d = k - i;
        c.classList.toggle("gone", d < 0);
        c.style.setProperty("--d", Math.max(d, 0));
        c.style.zIndex = d < 0 ? 0 : 100 - d;
        c.toggleAttribute("inert", d !== 0);
      });
      buttons.forEach((b, k) => b.setAttribute("aria-selected", String(k === i)));
    }
    select(0);

    // ---------- Pages ----------
    const pages = [...document.querySelectorAll(".page")];
    const ids = pages.map((p) => p.id);
    const links = [...document.querySelectorAll("#menu a")];
    const pillBg = $(".pill-bg"), bar = $("#bar");
    let cur = -1, camY = 0, first = true;   // camY: the starfield's smoothed vertical "camera" position

    function placePill(snap) {   // snap: jump instead of slide (first paint, resize, fonts loading)
      const a = links[cur]; if (!a) return;
      if (snap) pillBg.style.transition = "none";
      pillBg.style.width = a.offsetWidth + "px";
      pillBg.style.transform = `translateX(${a.offsetLeft}px)`;
      if (snap) { void pillBg.offsetWidth; pillBg.style.transition = ""; }
    }
    function render() {
      pages.forEach((p, k) => {
        p.classList.toggle("is-active", k === cur);
        p.classList.toggle("is-before", k < cur);
        p.toggleAttribute("inert", k !== cur);
      });
      links.forEach((a, k) => k === cur ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
      bar.style.width = ((cur + 1) / pages.length * 100) + "%";
      placePill(first);
      first = false;
    }
    function go(i, quiet) {
      i = Math.max(0, Math.min(pages.length - 1, i));
      if (i === cur) return false;
      cur = i;   // the starfield is never reset: it just glides to this page's offset (see draw)
      render();
      if (!quiet) history.replaceState(null, "", "#" + ids[cur]);
      return true;
    }
    links.forEach((a, k) => a.addEventListener("click", (e) => { e.preventDefault(); go(k); }));
    document.querySelectorAll('a[href^="#"]:not(#menu a)').forEach((a) => {
      a.addEventListener("click", (e) => { const k = ids.indexOf(a.hash.slice(1)); if (k >= 0) { e.preventDefault(); go(k); } });
    });

    // One wheel notch / swipe / key press = one page. A lock stops trackpad momentum skipping pages.
    let locked = false, lastWheel = 0;
    function step(dir) {
      if (locked) return;
      if (!go(cur + dir)) return;
      locked = true;
      const release = () => (performance.now() - lastWheel < 140 ? setTimeout(release, 60) : (locked = false));
      setTimeout(release, reduce ? 50 : 650);
    }
    addEventListener("wheel", (e) => {
      lastWheel = performance.now();
      if (Math.abs(e.deltaY) < 8 || Math.abs(e.deltaY) < Math.abs(e.deltaX)) return;
      step(e.deltaY > 0 ? 1 : -1);
    }, { passive: true });
    let ty0 = null, tx0 = 0;
    addEventListener("touchstart", (e) => { ty0 = e.touches[0].clientY; tx0 = e.touches[0].clientX; }, { passive: true });
    addEventListener("touchend", (e) => {
      if (ty0 === null) return;
      const dy = ty0 - e.changedTouches[0].clientY, dx = tx0 - e.changedTouches[0].clientX;
      ty0 = null;
      if (Math.abs(dy) > 48 && Math.abs(dy) > Math.abs(dx)) step(dy > 0 ? 1 : -1);
    }, { passive: true });
    addEventListener("keydown", (e) => {
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      const k = e.key;
      if (k === "ArrowDown" || k === "PageDown" || (k === " " && !e.shiftKey && e.target === document.body)) { e.preventDefault(); step(1); }
      else if (k === "ArrowUp" || k === "PageUp" || (k === " " && e.shiftKey)) { e.preventDefault(); step(-1); }
      else if (k === "Home") go(0);
      else if (k === "End") go(pages.length - 1);
      else if (cur === 1 && (k === "ArrowRight" || k === "ArrowLeft")) select(Math.max(0, Math.min(PROJECTS.length - 1, sel + (k === "ArrowRight" ? 1 : -1))));
    });
    addEventListener("hashchange", () => { const k = ids.indexOf(location.hash.slice(1)); if (k >= 0) go(k, true); });
    addEventListener("resize", () => placePill(true));
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => placePill(true));
    go(Math.max(0, ids.indexOf(location.hash.slice(1))), true);

    // ---------- Starfield + pointer effects (one animation loop) ----------
    const cv = $("#sky"), ctx = cv.getContext("2d");
    let W = 0, H = 0, stars = [];
    const sprite = document.createElement("canvas");   // soft blurred dot for the big "out of focus" stars
    sprite.width = sprite.height = 64;
    { const g = sprite.getContext("2d"), r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(.35, "rgba(255,255,255,.55)"); r.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = r; g.fillRect(0, 0, 64, 64); }

    function resize() {
      const dpr = Math.min(devicePixelRatio || 1, coarse ? 1.5 : 2);
      W = innerWidth; H = innerHeight;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = Math.min(coarse ? 110 : 190, Math.round(W * H / 9000));
      stars = Array.from({ length: n }, () => {
        const big = Math.random() < .07, z = big ? .9 + Math.random() * .6 : .2 + Math.random() * .7;
        return {
          x: Math.random() * W, y: Math.random() * H, z, big,
          r: big ? 5 + Math.random() * 9 : .5 + z * .9,
          a: big ? .18 + Math.random() * .22 : .35 + Math.random() * .6,
          vx: (Math.random() - .5) * .012 * z, vy: (-.004 - Math.random() * .012) * z,
          tw: Math.random() * 6.28, ts: .0004 + Math.random() * .0012, ox: 0, oy: 0,
        };
      });
    }
    resize();
    addEventListener("resize", () => { resize(); if (reduce) draw(0, 16); });

    let mx = -1e4, my = -1e4, nx = 0, ny = 0, sx = 0, sy = 0, lastMove = 0;
    addEventListener("pointermove", (e) => {
      if (e.pointerType === "touch") return;
      mx = e.clientX; my = e.clientY; lastMove = performance.now();
      nx = (mx / W - .5) * 2; ny = (my / H - .5) * 2;
    }, { passive: true });
    document.addEventListener("pointerleave", () => { mx = my = -1e4; });

    const REACH = 150;
    function draw(t, dt) {
      // Smooth pointer for tilt/parallax; with no pointer (phones, idle) drift gently on its own.
      const idle = t - lastMove > 2500;
      const tx = idle ? Math.sin(t / 2100) * .45 : nx, tyy = idle ? Math.cos(t / 2700) * .3 : ny;
      sx += (tx - sx) * .06; sy += (tyy - sy) * .06;
      // The background persists across pages: moving to the next page glides the "camera" down
      // through the same field, nearer (bigger) stars moving more, so pages feel like they float over it.
      camY += (cur * H * .45 - camY) * (1 - Math.pow(.0009, dt / 1000));

      ctx.clearRect(0, 0, W, H);
      for (const s of stars) {
        s.x += s.vx * dt; s.y += s.vy * dt;
        if (s.x < -20) s.x = W + 20; else if (s.x > W + 20) s.x = -20;
        if (s.y < -20) s.y = H + 20; else if (s.y > H + 20) s.y = -20;
        let gx = 0, gy = 0;
        const dx = s.x - mx, dy = s.y - my, d2 = dx * dx + dy * dy;
        if (d2 < REACH * REACH) { const d = Math.sqrt(d2) || 1, f = (1 - d / REACH) ** 2 * 46 * s.z; gx = dx / d * f; gy = dy / d * f; }
        s.ox += (gx - s.ox) * .1; s.oy += (gy - s.oy) * .1;
        const x = s.x + s.ox - sx * 22 * s.z;
        const y = (((s.y + s.oy - sy * 14 * s.z - camY * s.z) % H) + H) % H;
        const tw = reduce ? 1 : .75 + .25 * Math.sin(t * s.ts + s.tw);
        ctx.globalAlpha = s.a * tw;
        if (s.big) ctx.drawImage(sprite, x - s.r, y - s.r, s.r * 2, s.r * 2);
        else ctx.fillRect(x - s.r / 2, y - s.r / 2, s.r, s.r);
      }
      ctx.globalAlpha = 1;
      if (cur === 1 && !reduce) {   // tilt the project stack toward the cursor
        stack.style.setProperty("--ry", (sx * 7).toFixed(2) + "deg");
        stack.style.setProperty("--rx", (-sy * 5).toFixed(2) + "deg");
      }
    }
    ctx.fillStyle = "#fff";

    let raf = 0, prev = 0;
    function frame(t) {
      const dt = Math.min(48, t - prev || 16); prev = t;
      draw(t, dt);
      raf = requestAnimationFrame(frame);
    }
    function start() { if (!raf && !reduce) { prev = performance.now(); raf = requestAnimationFrame(frame); } }
    function stop() { cancelAnimationFrame(raf); raf = 0; }
    if (reduce) draw(0, 16); else start();
    document.addEventListener("visibilitychange", () => (document.hidden ? stop() : start()));   // no work in background tabs
  })();
  </script>
</body>
</html>
